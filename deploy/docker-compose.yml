name: contract-review-agent

services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root123456}"
      MYSQL_DATABASE: contract_review
      MYSQL_USER: cra
      MYSQL_PASSWORD: "${DB_PASSWORD:-cra123456}"
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - "./mysql/init:/docker-entrypoint-initdb.d:ro"
      - "mysql_data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [cranet]

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      TZ: Asia/Shanghai
      MYSQL_URL: "mysql+pymysql://cra:${DB_PASSWORD:-cra123456}@mysql:3306/contract_review?charset=utf8mb4"
      UPLOAD_DIR: "/srv/storage/attachments"
    ports:
      - "18000:8000"        # 前台(/)+后台(/admin)+API 唯一入口
    volumes:
      - attachment_data:/srv/storage/attachments
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [cranet]

networks:
  cranet:
    driver: bridge

volumes:
  mysql_data:
  attachment_data:
