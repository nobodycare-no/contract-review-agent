name: contract-review-agent

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root123456}"
      MYSQL_DATABASE: contract_review
      MYSQL_USER: cra
      MYSQL_PASSWORD: "${DB_PASSWORD:-cra123456}"
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - "./mysql/init:/docker-entrypoint-initdb.d:ro"
      - "mysql_data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [cranet]

  mock-approval:
    build: ../mock-approval
    # 开发便利：回环映射便于宿主机 curl 直调；生产移除
    ports:
      - "127.0.0.1:18100:8100"
    networks: [cranet]

  app:
    build: ../backend
    env_file: ../.env
    environment:
      MYSQL_URL: "mysql+pymysql://cra:${DB_PASSWORD:-cra123456}@mysql:3306/contract_review?charset=utf8mb4"
      UPLOAD_DIR: "/srv/storage/attachments"
      MOCK_BASE_URL: "http://mock-approval:8100"
    ports:
      - "18000:8000"        # 工具/Agent/Mock 全部经此入口
    depends_on:
      mysql:
        condition: service_healthy
      mock-approval:
        condition: service_started
    networks: [cranet]

networks:
  cranet:
    driver: bridge

volumes:
  mysql_data:
