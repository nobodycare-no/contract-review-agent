<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合同智能审查助手 · 工作台</title>
<style>
  :root{--bg:#f5f6fa;--panel:#ffffff;--line:#e3e7f0;--tx:#1d2433;--dim:#7a86a0;
        --hi:#e5484d;--md:#e79d13;--lo:#30a46c;--ac:#3b63dd}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  body{background:var(--bg);color:var(--tx);padding:20px 26px}
  h1{font-size:22px}
  .sub{color:var(--dim);font-size:13px;margin:4px 0 16px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--panel);
       border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  button{border:none;border-radius:9px;padding:9px 18px;font-size:14px;cursor:pointer;
         background:var(--panel);border:1px solid var(--line)}
  button:hover{filter:brightness(.97)}
  button.primary{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  select,input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  label.opt{font-size:13px;display:flex;gap:5px;align-items:center;color:var(--tx)}
  .hint{color:var(--dim);font-size:12px;width:100%}
  #msg{font-size:13px;color:var(--ac);min-width:120px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;
        overflow:hidden;border:1px solid var(--line);font-size:14px}
  th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px;background:#fafbfe}
  tr.row{cursor:pointer} tr.row:hover{background:#f0f4ff}
  .pill{display:inline-block;padding:2px 12px;border-radius:20px;font-size:12px;font-weight:600}
  .p-pending,.p-not_written{background:#eceff5;color:#55617e}
  .p-parsing{background:#e3edfc;color:#2b62c8}
  .p-reviewing{background:#fdf1dc;color:#9a6b06}
  .p-blocked,.p-failed{background:#fde8e8;color:#c0343a}
  .p-done,.p-success{background:#e2f4ea;color:#1d7a4c}
  .lv-high{background:#fde8e8;color:#c0343a} .lv-medium{background:#fdf1dc;color:#9a6b06}
  .lv-low{background:#e2f4ea;color:#1d7a4c} .lv-none{background:#eceff5;color:#8892ab}
  section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
               padding:16px 18px;margin-bottom:14px}
  section.card h3{font-size:15px;margin-bottom:10px;color:var(--ac)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-size:14px}
  .kv b{color:var(--dim);font-weight:400;white-space:nowrap}
  .issue{background:#fbfcfe;border:1px solid var(--line);border-left:4px solid var(--lo);
         border-radius:8px;padding:10px 14px;margin-bottom:8px}
  .issue.h{border-left-color:var(--hi)} .issue.m{border-left-color:var(--md)}
  .issue .t{font-weight:600;margin-bottom:3px}
  .issue .q{color:#59637d;font-size:13px;margin:3px 0}
  .issue .q em{background:#fff3c4;font-style:normal;padding:0 3px;border-radius:3px}
  pre.opinion{white-space:pre-wrap;line-height:1.9;font-size:14px;font-family:inherit;
              background:#fbfcfe;border:1px dashed var(--line);border-radius:10px;padding:16px}
  details{margin-top:14px;color:var(--dim);font-size:12px}
  summary{cursor:pointer}
  details pre{font-family:Consolas,monospace;font-size:11px;color:#66708c;margin-top:8px}
  .hidden{display:none}
  a.back{color:var(--ac);font-size:13px;cursor:pointer;text-decoration:none}
</style>
</head>
<body>

<div id="listView">
  <h1>合同智能审查助手</h1>
  <div class="sub">自动阅读待审合同 → 找出风险点并给出建议 → 把审查意见写到审批单评论区。最终决策始终由审批人做出。</div>

  <div class="bar">
    <button onclick="pullNew()">同步最新审批单</button>
    <select id="pick"></select>
    <label class="opt"><input type="checkbox" id="dry"> 仅演练，不写入评论区</label>
    <button class="primary" id="runBtn" onclick="startReview()">开始自动审查</button>
    <span id="msg"></span>
    <span style="flex:1"></span>
    <details><summary>技术详情（运维）</summary><pre id="mini"></pre></details>
  </div>

  <table>
    <thead><tr><th>合同 / 审批单</th><th>申请人</th><th>审查状态</th><th>综合风险</th><th>意见写入</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="detailView" class="hidden">
  <div class="bar"><a class="back" onclick="showList()">← 返回列表</a>
    <button onclick="loadDetail(cur)" style="margin-left:auto">刷新</button></div>
  <div id="detailBody"></div>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const STATUS={pending:'待处理',parsing:'正在解析',reviewing:'正在审查',blocked:'需人工处理',done:'已完成'};
const WRITE ={not_written:'尚未生成',writing:'写入中…',success:'已写入审批单评论区',failed:'写入失败'};
const LEVEL ={high:'高风险',medium:'中风险',low:'低风险'};
const pill=(cls,txt)=>`<span class="pill p-${cls}">${esc(txt)}</span>`;
const lvPill=l=>l?`<span class="pill lv-${l}">${LEVEL[l]}</span>`:'<span class="pill lv-none">未评估</span>';
let cur=null;

async function j(url,opt){const r=await fetch(url,opt);
  if(!r.ok) throw new Error('HTTP '+r.status);return r.json();}

async function health(){
  try{const c=(await j('/health')).components;
    $('mini').textContent=`健康检查  数据库:${c.mysql.ok?'正常':'异常'}  审批接口:${c.mock.ok?'正常':'异常'}  AI模型:${c.llm.ok===true?'在线':c.llm.ok===false?'离线(自动降级规则模式)':'未配置'}`;
  }catch(e){$('mini').textContent='后端不可达';}}

async function loadList(){
  const ts=(await j('/agent/tasks')).tasks.sort((a,b)=>b.id-a.id);
  const pickable=ts.filter(t=>t.task_status==='pending');
  $('pick').innerHTML=pickable.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')
    ||'<option value="">（暂无新的待审合同）</option>';
  $('rows').innerHTML=ts.map(t=>`
    <tr class="row" onclick="openDetail(${t.id})">
      <td>${esc(t.title)}</td>
      <td>${esc(t.applicant)}</td>
      <td>${pill(t.task_status,STATUS[t.task_status])}${t.task_status==='blocked'?`<div style="font-size:12px;color:var(--hi)">${esc((t.block_reason||'').slice(0,40))}</div>`:''}</td>
      <td data-lv="${t.id}">—</td>
      <td>${pill(t.write_status.replace('_','_'),WRITE[t.write_status])}</td>
    </tr>`).join('')||'<tr><td colspan=5 style="color:var(--dim)">还没有任务，点上面「同步最新审批单」开始。</td></tr>';
  // 列表上的风险等级需要逐个查详情太重；由详情页更新即可，这里显示占位由全局缓存补充
  fillRiskBadges(ts);
}

let riskCache={};
function fillRiskBadges(ts){
  ts.forEach(t=>{const lv=riskCache[t.id];
    if(lv!==undefined){const td=document.querySelector(`td[data-lv="${t.id}"]`);
      if(td)td.innerHTML=lvPill(lv);}});
}

async function pullNew(){
  msg('正在同步…');
  await j('/tools/list_pending',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"limit":20}'});
  msg('已同步'); loadList();
}

async function startReview(){
  const id=+$('pick').value;
  if(!id){alert('请先「同步最新审批单」，并确保有「待处理」状态的合同。');return;}
  const btn=$('runBtn'); btn.disabled=true;
  msg('AI 正在阅读合同并撰写审查意见，约需几十秒…');
  try{
    const r=await j('/agent/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({task_id:id,dry_run:$('dry').checked})});
    riskCache[id]=undefined;
    msg(r.status==='succeeded'?'✓ 审查完成':'⚠ 未完成：'+(r.error_digest||r.fallback_kind||r.status));
    await loadList(); openDetail(id);
    health();
  }catch(e){msg('运行失败：'+e.message);}
  btn.disabled=false;
}

async function openDetail(id){cur=id;$('listView').classList.add('hidden');
  $('detailView').classList.remove('hidden');loadDetail(id);}

function showList(){cur=null;$('detailView').classList.add('hidden');
  $('listView').classList.remove('hidden');loadList();}

async function loadDetail(id){
  const d=await j('/agent/tasks/'+id);
  const t=d.task;
  const hits=d.hits.filter(h=>h.hit_status==='hit'&&h.rule_code!=='AI_DISCRETIONARY')
                   .map(h=>issueHTML(h.risk_level,h.rule_name,h.evidence,h.position,false));
  const ai=d.hits.filter(h=>h.hit_status==='hit'&&h.rule_code==='AI_DISCRETIONARY')
                 .map(h=>issueHTML(h.risk_level,h.rule_name,h.evidence,'',true));
  riskCache[id]=d.review?.overall_risk_level||null;

  let reviewBlock='';
  if(d.review){
    reviewBlock=`<section class="card"><h3>AI 审查意见（将/已写入审批单评区的全文）</h3>
      <pre class="opinion">${esc(d.review.comment_text)}</pre></section>`;
  }else if(t.task_status==='done'||t.task_status==='reviewing'){
    reviewBlock=`<section class="card"><h3>AI 审查意见</h3><i style="color:var(--dim)">尚未生成</i></section>`;
  }

  let writeLine='';
  d.comment_logs.forEach(c=>{if(c.write_status==='success')writeLine='✅ 已成功写入审批系统';
                             else if(c.write_status==='failed')writeLine='❌ 写入失败'+(c.response?('：'+c.response):'')});
  if($('dry').checked&&t.write_status==='not_written'&&t.task_status!=='done')writeLine='🔒 本次为演练模式，意见未写入';

  const FIELD_ZH={contract_title:'合同名称',contract_no:'合同编号',party_a:'甲方(己方)',
                  party_b:'乙方(对方)',amount:'合同金额',currency:'币种',
                  effective_date:'生效日期',expire_date:'到期日期'};
  const CLAUSE_ZH={payment_clause:'付款条款',delivery_clause:'交付条款',
                   acceptance_clause:'验收条款',breach_clause:'违约责任',
                   confidential_clause:'保密条款',data_clause:'数据处理',
                   ip_clause:'知识产权',dispute_clause:'争议解决'};
  const bi=d.parse?.basic_info;
  const basicRows=bi?Object.entries(bi).map(([k,v])=>{
      const val=v&&v.value!=null?v.value:(v&&(v.raw_text||''))||null;
      return `<b>${FIELD_ZH[k]||k}</b><span>${val!=null?esc(String(val)): '—'}${
        v&&v.status==='inferred'?' <i style="color:var(--dim)">(推断)</i>':''}</span>`}).join('')
    :'<b>-</b><span style="color:var(--dim)">尚未解析</span>';
  const cl=d.parse?.clauses;
  const clauseRows=cl?Object.entries(cl).map(([k,v])=>
    `<b>${CLAUSE_ZH[k]||k}</b><span>${
      v.status==='present'?`✅ 已约定（${esc((v.snippet||'').slice(0,50))}…）`
     :v.status==='absent' ?'⚠️ 未发现相关条款':'—'}</span>`).join('')
   :'<b>-</b><span style="color:var(--dim)">—</span>';

  $('detailBody').innerHTML=`
   ${d.review?.overall_risk_level?`
   <section class="card" style="border-left:6px solid ${d.review.overall_risk_level==='high'?'var(--hi)':d.review.overall_risk_level==='medium'?'var(--md)':'var(--lo)'}">
     <div class="kv"><b>综合风险评级</b><span style="font-size:20px;font-weight:700">${LEVEL[d.review.overall_risk_level]||d.review.overall_risk_level}</span>
       <b>当前状态</b><span>${pill(t.task_status,STATUS[t.task_status])}　${pill(t.write_status,WRITE[t.write_status])}</span>
       ${writeLine?`<b>回写结果</b><span>${esc(writeLine)}</span>`:''}</div></section>`:''}

   <section class="card"><h3>合同基本信息</h3><div class="kv">${basicRows}</div></section>
   <section class="card"><h3>条款覆盖情况</h3><div class="kv">${clauseRows}</div></section>

   <section class="card"><h3>按规则识别的风险 (${hits.length})</h3>${hits.length?hits.join(''):'<i style="color:var(--dim)">规则库全部通过 ✓</i>'}</section>
   ${ai.length?`<section class="card"><h3>AI 补充提示（规则库之外的自由裁量观察，供参考）(${ai.length})</h3>${ai.join('')}</section>`:''}
   ${reviewBlock}`;

  function issueHTML(level,name,evidence,pos){
    return `<div class="issue ${level==='high'?'h':level==='medium'?'m':''}">
      <div class="t">${LEVEL[level]||''} · ${esc(name)}</div>
      ${evidence?`<div class="q">📄 依据原文：<em>${esc(evidence.slice(0,120))}</em></div>`:''}
      ${pos?`<div class="q" style="color:var(--dim)">位置：${esc(pos)}</div>`:''}</div>`;
  }
}

health(); loadList(); setInterval(health,15000);
</script>
</body>
</html>
